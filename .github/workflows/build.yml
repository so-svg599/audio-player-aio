name: Build APK léger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler l'APK Release optimisé
        run: gradle :app:assembleRelease --no-daemon

      - name: Afficher la taille de l'APK
        shell: bash
        run: ls -lh app/build/outputs/apk/release/*.apk

      - name: Publier l'APK optimisé
        uses: actions/upload-artifact@v4
        with:
          name: musique-apk-release-light
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
